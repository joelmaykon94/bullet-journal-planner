<!-- Ultra-Compact Circle Icon Habit Tracker Bar (Collapsible for Mobile & Desktop) -->
<div class="habit-matrix-top mb-3 pb-2.5 border-b border-[#e2d5c3]/80 dark:border-[#e3dac9]/15 flex flex-col gap-2.5 select-none">
  
  <!-- Full-Width Dynamic Progress Bar Header (Clickable Eye Toggle) -->
  <div class="w-full flex flex-col gap-1 px-0.5 cursor-pointer group" (click)="toggleCollapse()" title="Clique para ocultar ou mostrar a régua de hábitos">
    <div class="flex items-center justify-between text-[11px] font-mono font-bold">
      
      <!-- Title "Hábitos Diários" + Eye Open / Eye Closed Toggle Icon (Strictly #4a3b32 Espresso Brown) -->
      <span class="font-serif text-xs font-bold tracking-tight flex items-center gap-1.5 transition-colors" style="color: #4a3b32 !important;">
        <span style="color: #4a3b32 !important;">Hábitos Diários</span>
        
        <!-- Interactive Eye Icon with Tooltip Info & Hover Effect -->
        <span [title]="isCollapsed ? 'Clique para mostrar hábitos' : 'Clique para ocultar hábitos'" 
              class="inline-flex items-center justify-center p-0.5 rounded-full hover:bg-[#e2d5c3]/50 dark:hover:bg-white/10 transition-all cursor-pointer hover:scale-110 active:scale-95">
          
          <!-- Eye Open Icon (Visible Habits) -->
          <svg *ngIf="!isCollapsed" class="w-4 h-4 transition-transform duration-150" style="color: #4a3b32 !important; stroke: #4a3b32 !important;" viewBox="0 0 24 24" fill="none" stroke="#4a3b32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>

          <!-- Eye Closed / Slash Icon (Hidden Habits) -->
          <svg *ngIf="isCollapsed" class="w-4 h-4 transition-transform duration-150" style="color: #4a3b32 !important; stroke: #4a3b32 !important;" viewBox="0 0 24 24" fill="none" stroke="#4a3b32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
            <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
            <line x1="2" y1="2" x2="22" y2="22"/>
          </svg>
        </span>
      </span>

      <!-- Count Badge ONLY (Light Beige #7a6656) -->
      <div class="flex items-center">
        <span class="bg-[#f2ebdf] dark:bg-[#1c1917] px-2 py-0.5 rounded-full border border-[#e2d5c3] dark:border-[#e3dac9]/20 text-[10px] font-bold" style="color: #7a6656 !important;">
          {{ getCompletedCount() }}/{{ habitItems.length }} ({{ getCompletionPercentage() }}%)
        </span>
      </div>
    </div>
    
    <!-- Full-Width Progress Bar Track -->
    <div class="w-full h-2 bg-[#f2ebdf] dark:bg-[#1c1917] rounded-full border border-[#e2d5c3] dark:border-[#e3dac9]/20 overflow-hidden shadow-inner relative">
      <div [style.width.%]="getCompletionPercentage()"
           [ngClass]="getProgressBarColorClass()"
           class="h-full rounded-full transition-all duration-500 ease-out animate-pulse shadow-xs">
      </div>
    </div>
  </div>

  <!-- Compact Circle Buttons Flex Wrap Container (Hidden when Collapsed) -->
  <div *ngIf="!isCollapsed" 
       class="flex flex-wrap items-start justify-start gap-3 sm:gap-4 py-0.5 px-0.5 animate-in fade-in-50 slide-in-from-top-1 duration-200">
    
    <!-- Active Habit Circles -->
    <div *ngFor="let item of habitItems" 
         class="flex flex-col items-center gap-1 shrink-0 group relative">
      
      <!-- Compact Circle Icon Button (w-9 h-9 / 36px) -->
      <button (click)="toggleHabit(item.title)"
              [ngClass]="isCompleted(item.title) 
                ? 'bg-[#4a3b32] dark:bg-[#e3dac9] border-[#29201a] dark:border-[#e3dac9] text-[#fdfbf7] dark:text-[#2a2724] shadow-md scale-105' 
                : 'bg-[#f2ebdf] dark:bg-[#1c1917] border-[#d7c8b4] dark:border-[#e3dac9]/20 text-[#4a3b32] dark:text-[#e3dac9] hover:bg-[#e6dbcd] dark:hover:bg-[#e3dac9]/10 shadow-xs'"
              class="w-9 h-9 rounded-full border-2 flex items-center justify-center relative transition-all duration-150 active:scale-90 cursor-pointer">
        
        <!-- Completed Check Badge -->
        <span *ngIf="isCompleted(item.title) && !isEditMode" 
              class="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-emerald-600 text-white font-bold text-[8px] flex items-center justify-center border border-white dark:border-stone-900 shadow-xs animate-in zoom-in-50 duration-150">
          ✓
        </span>

        <!-- SVG Icon Mapping (w-4 h-4 / 16px) -->
        <ng-container [ngSwitch]="item.icon">
          <!-- Água -->
          <svg *ngSwitchCase="'droplet'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
          <!-- Mestrado -->
          <svg *ngSwitchCase="'graduation-cap'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <!-- Musculação -->
          <svg *ngSwitchCase="'dumbbell'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
          <!-- Veículo / Óleo -->
          <svg *ngSwitchCase="'car'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2 10.9 2 11.2 2 11.5V16c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
          <!-- Lixo -->
          <svg *ngSwitchCase="'trash'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <!-- Medicamento -->
          <svg *ngSwitchCase="'pill'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
          <!-- Leitura -->
          <svg *ngSwitchCase="'book'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <!-- Sol -->
          <svg *ngSwitchCase="'sun'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/></svg>
          <!-- Lua -->
          <svg *ngSwitchCase="'moon'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <!-- Maçã -->
          <svg *ngSwitchCase="'apple'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/></svg>
          <!-- Café -->
          <svg *ngSwitchCase="'coffee'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/></svg>
          <!-- Coração -->
          <svg *ngSwitchCase="'heart'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <!-- Passos -->
          <svg *ngSwitchCase="'footprints'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.38C4 11.5 2.97 9.5 3 8c.03-1.6 1.5-3 3.5-3s3.47 1.4 3.5 3c.03 1.5-1 3.5-1 5.62V16"/><path d="M14 20v-2.38c0-2.12-1.03-4.12-1-5.62.03-1.6 1.5-3 3.5-3s3.47 1.4 3.5 3c.03 1.5-1 3.5-1 5.62V20"/></svg>
          <!-- Bicicleta -->
          <svg *ngSwitchCase="'bike'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
          <!-- Fone -->
          <svg *ngSwitchCase="'headphones'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-5a9 9 0 0 1 18 0v5a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
          <!-- Caneta -->
          <svg *ngSwitchCase="'pen'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
          <!-- Computador -->
          <svg *ngSwitchCase="'laptop'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55A1 1 0 0 1 20.37 20H3.63a1 1 0 0 1-.91-1.45L4 16"/></svg>
          <!-- Carteira -->
          <svg *ngSwitchCase="'wallet'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
          <!-- Planta -->
          <svg *ngSwitchCase="'plant'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-8"/><path d="M12 14C8 14 5 10 5 6c4 0 7 3 7 8Z"/><path d="M12 14c4 0 7-4 7-8-4 0-7 4-7 8Z"/></svg>
          <!-- Zap -->
          <svg *ngSwitchCase="'zap'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <!-- Smile -->
          <svg *ngSwitchCase="'smile'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          <!-- Shield -->
          <svg *ngSwitchCase="'shield'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
          <!-- Award -->
          <svg *ngSwitchCase="'award'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>

          <!-- Default Target -->
          <svg *ngSwitchDefault class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </ng-container>

      </button>

      <!-- Compact Habit Label below circle -->
      <span class="text-[10px] font-sans font-bold text-[#382c25] dark:text-[#e3dac9] text-center max-w-[56px] truncate leading-tight">
        {{ item.title }}
      </span>

      <!-- Explicit Red Delete Button (ONLY Visible in Edit Mode!) -->
      <button *ngIf="isEditMode"
              class="text-[10px] text-white bg-rose-600 hover:bg-rose-700 transition-all absolute -top-1 -right-1 w-4 h-4 rounded-full border border-white dark:border-stone-900 flex items-center justify-center font-bold shadow-md cursor-pointer z-10 animate-in zoom-in-50 duration-150"
              (click)="removeHabit(item, $event)"
              title="Remover hábito">
        ✕
      </button>
    </div>

    <!-- Inline + Novo Compact Circle Button -->
    <div class="flex flex-col items-center gap-1 shrink-0 group">
      <button (click)="openAddModal()"
              title="Adicionar novo hábito"
              class="w-9 h-9 rounded-full border-2 border-dashed border-[#4a3b32]/50 dark:border-[#e3dac9]/30 bg-[#f2ebdf]/60 dark:bg-[#1c1917]/60 hover:bg-[#e6dbcd] dark:hover:bg-[#e3dac9]/20 text-[#4a3b32] dark:text-[#e3dac9] flex items-center justify-center transition-all duration-150 active:scale-90 cursor-pointer shadow-2xs">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <span class="text-[10px] font-sans font-bold text-[#7a6656] dark:text-[#afa393] text-center max-w-[56px] truncate leading-tight" style="color: #7a6656 !important;">
        Novo
      </span>
    </div>

    <!-- Inline Circle Edit/Manage Compact Button -->
    <div class="flex flex-col items-center gap-1 shrink-0 group">
      <button (click)="toggleEditMode()"
              [title]="isEditMode ? 'Concluir Edição' : 'Gerenciar / Remover Hábitos'"
              [ngClass]="isEditMode 
                ? 'bg-[#4a3b32] dark:bg-[#e3dac9] border-[#29201a] dark:border-[#e3dac9] text-[#fdfbf7] dark:text-[#2a2724] shadow-md scale-105' 
                : 'border-2 border-dashed border-[#4a3b32]/50 dark:border-[#e3dac9]/30 bg-[#f2ebdf]/60 dark:bg-[#1c1917]/60 hover:bg-[#e6dbcd] dark:hover:bg-[#e3dac9]/20 text-[#4a3b32] dark:text-[#e3dac9] shadow-2xs'"
              class="w-9 h-9 rounded-full border-2 flex items-center justify-center transition-all duration-150 active:scale-90 cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
      <span class="text-[10px] font-sans font-bold text-[#7a6656] dark:text-[#afa393] text-center max-w-[56px] truncate leading-tight" style="color: #7a6656 !important;">
        {{ isEditMode ? 'Pronto' : 'Editar' }}
      </span>
    </div>

  </div>

  <!-- ADD HABIT MODAL WITH ICON SELECTOR -->
  <div *ngIf="showAddModal" 
       class="fixed inset-0 bg-[#292524]/40 dark:bg-black/80 backdrop-blur-xs z-[999999] flex items-center justify-center p-4"
       (click)="showAddModal = false">
    
    <div class="bg-[#faf7f5] dark:bg-[#2a2724] border-2 border-[#e2d5c3] dark:border-[#e3dac9]/20 text-[#4a3b32] dark:text-[#e3dac9] rounded-xl w-full max-w-md p-5 shadow-2xl flex flex-col gap-4 relative animate-in zoom-in-95 duration-150"
         (click)="$event.stopPropagation()">
      
      <div class="flex items-center justify-between border-b border-[#e2d5c3] dark:border-[#e3dac9]/20 pb-3">
        <h3 class="font-serif text-lg font-bold text-[#4a3b32] dark:text-[#f5f5f4]" style="color: #4a3b32 !important;">Novo Hábito com Ícone</h3>
        <button class="w-7 h-7 rounded-lg bg-[#f2ebdf] dark:bg-[#1c1917] text-[#4a3b32] dark:text-[#e3dac9] font-bold text-xs" (click)="showAddModal = false">✕</button>
      </div>

      <div class="flex flex-col gap-3">
        <!-- Habit Name Input -->
        <div class="flex flex-col gap-1">
          <label class="text-xs font-bold text-[#4a3b32] dark:text-[#e3dac9]" style="color: #4a3b32 !important;">Nome do Hábito:</label>
          <input type="text" 
                 [(ngModel)]="newHabitName" 
                 placeholder="ex: Água 2L, Mestrado, Musculação..." 
                 class="w-full bg-[#fdfbf7] dark:bg-[#1c1917] border border-[#e2d5c3] dark:border-[#e3dac9]/20 rounded-lg p-2.5 text-sm text-[#1c1917] dark:text-[#f5f5f4] font-medium outline-none focus:border-[#4a3b32]" 
                 (keydown.enter)="addHabit()" />
        </div>

        <!-- Icon Picker Header & Search -->
        <div class="flex flex-col gap-1.5 mt-1">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-[#4a3b32] dark:text-[#e3dac9]" style="color: #4a3b32 !important;">Selecione o Ícone ({{ filteredIcons.length }} opções):</label>
          </div>

          <!-- Icon Search Field -->
          <div class="relative">
            <input type="text" 
                   [(ngModel)]="iconSearchQuery" 
                   placeholder="🔍 Buscar ícone (ex: água, treino, livro)..." 
                   class="w-full bg-[#fdfbf7] dark:bg-[#1c1917] border border-[#e2d5c3] dark:border-[#e3dac9]/20 rounded-lg py-2 px-3 text-xs text-[#1c1917] dark:text-[#f5f5f4] outline-none focus:border-[#4a3b32] font-sans font-medium" />
          </div>

          <!-- Scrollable Icon Grid (Grid de 24 Ícones) -->
          <div class="grid grid-cols-6 gap-2 max-h-44 overflow-y-auto p-1.5 bg-[#f2ebdf] dark:bg-[#1c1917] border border-[#e2d5c3] dark:border-[#e3dac9]/20 rounded-xl no-scrollbar">
            <button *ngFor="let icon of filteredIcons" 
                    (click)="selectIcon(icon.id)"
                    [title]="icon.name"
                    [ngClass]="selectedIconId === icon.id 
                      ? 'bg-[#4a3b32] dark:bg-[#e3dac9] text-white dark:text-[#2a2724] border-[#29201a] scale-110 shadow-md' 
                      : 'bg-[#faf7f5] dark:bg-[#2a2724] text-[#4a3b32] dark:text-[#e3dac9] border-[#e2d5c3] dark:border-[#e3dac9]/20 hover:bg-[#e6dbcd]'"
                    class="w-9 h-9 rounded-full border flex items-center justify-center transition-all cursor-pointer">
              
              <ng-container [ngSwitch]="icon.id">
                <svg *ngSwitchCase="'droplet'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                <svg *ngSwitchCase="'graduation-cap'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                <svg *ngSwitchCase="'dumbbell'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
                <svg *ngSwitchCase="'car'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2 10.9 2 11.2 2 11.5V16c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
                <svg *ngSwitchCase="'trash'" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
