<div class="max-w-4xl mx-auto p-4 sm:p-6 pb-24">
  <!-- Quick Add Form -->
  <form (submit)="addItem($event)" class="rounded-xl border border-[#e6dbcd] dark:border-stone-800 bg-[#faf7f5] dark:bg-stone-900 p-4 sm:p-5 shadow-sm mb-8 flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
    <div class="flex-1 min-w-0">
      <input type="text" 
             [(ngModel)]="newItemContent" 
             name="content"
             placeholder="Adicionar ideia para o futuro (ex.: Aprender Italiano, Viajar para o Japão...)"
             class="w-full bg-white dark:bg-stone-800/80 border border-[#d7c8b4] dark:border-stone-700 rounded-lg px-4 py-2.5 text-[#382c25] dark:text-stone-100 placeholder-stone-400 text-sm outline-none focus:border-[#4a3b32] dark:focus:border-[#e3dac9] transition-colors"
             autocomplete="off" />
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <select [(ngModel)]="selectedCategory" name="category" class="bg-white dark:bg-stone-800 border border-[#d7c8b4] dark:border-stone-700 rounded-lg px-3 py-2.5 text-xs font-mono font-bold text-[#382c25] dark:text-[#e3dac9] outline-none cursor-pointer">
        <option value="projetos" class="bg-white text-[#382c25] dark:bg-stone-800 dark:text-stone-100">🚀 Projeto</option>
        <option value="viagens" class="bg-white text-[#382c25] dark:bg-stone-800 dark:text-stone-100">✈️ Viagem</option>
        <option value="livros" class="bg-white text-[#382c25] dark:bg-stone-800 dark:text-stone-100">📚 Livro</option>
        <option value="estudos" class="bg-white text-[#382c25] dark:bg-stone-800 dark:text-stone-100">🎓 Estudo</option>
        <option value="outros" class="bg-white text-[#382c25] dark:bg-stone-800 dark:text-stone-100">💡 Ideia</option>
      </select>

      <button type="submit" [disabled]="!newItemContent.trim()" 
              title="Incubar Ideia"
              class="w-10 h-10 rounded-full bg-[#4a3b32] hover:bg-[#382c25] dark:bg-[#e3dac9] dark:hover:bg-white text-white dark:text-[#2a2724] font-bold text-lg flex items-center justify-center transition-all disabled:opacity-50 shrink-0 cursor-pointer shadow-sm hover:scale-105 active:scale-95">
        +
      </button>
    </div>
  </form>

  <!-- Filter Category Tabs (Transparent background with opacified unselected buttons) -->
  <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-6 no-scrollbar">
    <button (click)="categoryFilter = 'all'" 
            [class.bg-[#4a3b32]]="categoryFilter === 'all'" 
            [class.text-white]="categoryFilter === 'all'" 
            [class.border-[#4a3b32]]="categoryFilter === 'all'"
            [class.opacity-50]="categoryFilter !== 'all'"
            class="px-3.5 py-1.5 rounded-full font-mono text-xs font-bold transition-all bg-transparent text-[#4a3b32] dark:text-[#e3dac9] border border-[#d7c8b4] dark:border-stone-700 shrink-0 cursor-pointer hover:opacity-100">
      Todas ({{ somedayItems.length }})
    </button>
    <button (click)="categoryFilter = 'projetos'" 
            [class.bg-purple-700]="categoryFilter === 'projetos'" 
            [class.text-white]="categoryFilter === 'projetos'" 
            [class.border-purple-700]="categoryFilter === 'projetos'"
            [class.opacity-50]="categoryFilter !== 'projetos'"
            class="px-3.5 py-1.5 rounded-full font-mono text-xs font-bold transition-all bg-transparent text-purple-700 dark:text-purple-300 border border-purple-300 dark:border-purple-800 shrink-0 cursor-pointer hover:opacity-100">
      🚀 Projetos
    </button>
    <button (click)="categoryFilter = 'viagens'" 
            [class.bg-blue-700]="categoryFilter === 'viagens'" 
            [class.text-white]="categoryFilter === 'viagens'" 
            [class.border-blue-700]="categoryFilter === 'viagens'"
            [class.opacity-50]="categoryFilter !== 'viagens'"
            class="px-3.5 py-1.5 rounded-full font-mono text-xs font-bold transition-all bg-transparent text-blue-700 dark:text-blue-300 border border-blue-300 dark:border-blue-800 shrink-0 cursor-pointer hover:opacity-100">
      ✈️ Viagens
    </button>
    <button (click)="categoryFilter = 'livros'" 
            [class.bg-emerald-700]="categoryFilter === 'livros'" 
            [class.text-white]="categoryFilter === 'livros'" 
            [class.border-emerald-700]="categoryFilter === 'livros'"
            [class.opacity-50]="categoryFilter !== 'livros'"
            class="px-3.5 py-1.5 rounded-full font-mono text-xs font-bold transition-all bg-transparent text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800 shrink-0 cursor-pointer hover:opacity-100">
      📚 Livros
    </button>
    <button (click)="categoryFilter = 'estudos'" 
            [class.bg-indigo-700]="categoryFilter === 'estudos'" 
            [class.text-white]="categoryFilter === 'estudos'" 
            [class.border-indigo-700]="categoryFilter === 'estudos'"
            [class.opacity-50]="categoryFilter !== 'estudos'"
            class="px-3.5 py-1.5 rounded-full font-mono text-xs font-bold transition-all bg-transparent text-indigo-700 dark:text-indigo-300 border border-indigo-300 dark:border-indigo-800 shrink-0 cursor-pointer hover:opacity-100">
      🎓 Estudos
    </button>
    <button (click)="categoryFilter = 'outros'" 
            [class.bg-amber-700]="categoryFilter === 'outros'" 
            [class.text-white]="categoryFilter === 'outros'" 
            [class.border-amber-700]="categoryFilter === 'outros'"
            [class.opacity-50]="categoryFilter !== 'outros'"
            class="px-3.5 py-1.5 rounded-full font-mono text-xs font-bold transition-all bg-transparent text-amber-700 dark:text-amber-300 border border-amber-300 dark:border-amber-800 shrink-0 cursor-pointer hover:opacity-100">
      💡 Outros
    </button>
  </div>

  <!-- Items List Grid -->
  <div *ngIf="filteredItems.length > 0; else emptyState" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div *ngFor="let item of filteredItems" class="rounded-xl border border-[#e6dbcd] dark:border-stone-800 bg-[#faf7f5] dark:bg-stone-900 p-5 shadow-xs hover:shadow-md transition-all flex flex-col justify-between gap-4 group">
      <div>
        <div class="flex items-center justify-between gap-2 mb-3">
          <span [class]="getItemCategoryBadge(item).class" class="px-2.5 py-0.5 rounded-md text-[10px] font-mono font-bold border">
            {{ getItemCategoryBadge(item).label }}
          </span>
          <span class="text-[10px] font-mono text-stone-500 dark:text-stone-400">
            Incubado em {{ item.createdAt | date:'dd/MM/yyyy' }}
          </span>
        </div>
        <p class="text-[#382c25] dark:text-stone-100 font-sans font-medium text-base leading-snug">
          {{ item.content }}
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-between pt-3 border-t border-[#e6dbcd] dark:border-stone-800/80 gap-2">
        <div class="flex items-center gap-1.5">
          <button (click)="moveToToday(item)" title="Ativar para Hoje no Daily Log" class="px-3 py-1 bg-[#4a3b32] hover:bg-[#382c25] text-white dark:bg-[#e3dac9] dark:text-[#2a2724] dark:hover:bg-white font-mono text-[11px] font-bold rounded-md transition-colors flex items-center gap-1 cursor-pointer shadow-xs">
            <span>📌 Hoje</span>
          </button>
          <button (click)="openScheduleModal(item)" title="Agendar Data" class="px-3 py-1 bg-[#f2ebdf] hover:bg-[#e6dbcd] text-[#4a3b32] dark:bg-stone-800 dark:text-[#e3dac9] dark:hover:bg-stone-700 font-mono text-[11px] font-bold rounded-md border border-[#d7c8b4] dark:border-stone-700 transition-colors flex items-center gap-1 cursor-pointer shadow-xs">
            <span>📅 Agendar</span>
          </button>
        </div>

        <div class="flex items-center gap-1">
          <button (click)="completeItem(item)" title="Concluir Ideia" class="p-1.5 text-stone-400 hover:text-emerald-700 dark:hover:text-emerald-400 transition-colors cursor-pointer">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
          <button (click)="deleteItem(item)" title="Excluir" class="p-1.5 text-stone-400 hover:text-red-700 dark:hover:text-red-400 transition-colors cursor-pointer">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      </div>

      <!-- Schedule Modal Inline Popover -->
      <div *ngIf="activeScheduleItemId === item.id" class="mt-3 p-3 bg-white dark:bg-stone-800 rounded-lg border border-[#d7c8b4] dark:border-stone-700 flex items-center gap-2">
        <input type="date" [(ngModel)]="scheduleDate" class="bg-[#faf7f5] dark:bg-stone-900 border border-[#d7c8b4] dark:border-stone-600 rounded px-2 py-1 text-xs font-mono text-[#382c25] dark:text-stone-200 outline-none flex-1" />
        <button (click)="confirmSchedule(item)" class="px-3 py-1 bg-[#4a3b32] text-white font-mono text-xs font-bold rounded cursor-pointer">Confirmar</button>
        <button (click)="activeScheduleItemId = null" class="px-2 py-1 text-stone-500 hover:text-stone-800 text-xs font-bold cursor-pointer">✕</button>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="text-center py-16 px-4 bg-[#faf7f5] dark:bg-stone-900 rounded-2xl border border-dashed border-[#d7c8b4] dark:border-stone-800">
      <div class="text-5xl mb-4">🌱</div>
      <h3 class="font-serif font-bold text-xl text-[#382c25] dark:text-stone-200 mb-1">Nenhuma ideia nesta categoria</h3>
      <p class="text-sm text-stone-600 dark:text-stone-400 max-w-sm mx-auto">
        Utilize a caixa de entrada acima para incubar pensamentos e sonhos sem pressa de data de execução.
      </p>
    </div>
  </ng-template>
</div>
