<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BuJo Focus</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23292524' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/><path d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1c1917">
  
  <!-- FontAwesome for standard icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    (function() {
      try {
        var theme = localStorage.getItem('bujo_theme');
        if (theme === 'dark' || (!theme)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* Prevent Flash of Unstyled Content (FOUC) & Instant Preloader */
    html {
      background-color: #1c1917;
      color: #f5f5f4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html.dark {
      background-color: #1c1917;
      color: #f5f5f4;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: #1c1917;
      color: #f5f5f4;
    }
    app-root {
      display: block;
      height: 100%;
      width: 100%;
    }
    #app-preloader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: #1c1917;
      color: #f5f5f4;
      box-sizing: border-box;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      padding: 20px;
      text-align: center;
    }
    #app-preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .app-initializer-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5f5f4;
      animation: bujo-pulse 2s ease-in-out infinite;
      overflow: hidden;
      padding: 8px;
    }
    .app-initializer-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .app-initializer-title {
      font-family: serif, "Playfair Display", Georgia, Times, serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #f5f5f4;
      margin-top: 4px;
    }
    .app-initializer-subtitle {
      font-size: 13px;
      font-family: serif, "Playfair Display", Georgia, Times, serif;
      font-style: italic;
      letter-spacing: 0.02em;
      color: #d6d3d1;
      margin-top: -6px;
      max-width: 320px;
      line-height: 1.4;
    }
    .app-initializer-bar-track {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-top: 6px;
    }
    .app-initializer-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, #6366f1, #10b981, #6366f1);
      border-radius: 9999px;
      animation: bujo-bar-slide 1.4s ease-in-out infinite;
    }
    @keyframes bujo-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.85; }
    }
    @keyframes bujo-bar-slide {
      0% { left: -40%; width: 30%; }
      50% { left: 35%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
  <script src="assets/loading-phrases.js"></script>
  <script src="env.js?v=2"></script>
</head>
<body>
  <div id="app-preloader">
    <div class="app-initializer-logo">
      <img src="assets/icons/icon-192x192.png" 
           srcset="assets/icons/icon-128x128.png 1x, assets/icons/icon-192x192.png 2x, assets/icons/icon-512x512.png 3x" 
           alt="BuJo Focus" 
           onerror="this.onerror=null; this.parentNode.innerHTML='<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'32\' height=\'32\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\'/><path d=\'M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\'/></svg>';">
    </div>
    <div class="app-initializer-title">BuJo Focus</div>
    <div class="app-initializer-subtitle" id="preloader-subtitle">Ótimo, preparando seu dia produtivo!</div>
    <div class="app-initializer-bar-track">
      <div class="app-initializer-bar-fill"></div>
    </div>
  </div>
  <script>
    (function() {
      try {
        var subEl = document.getElementById('preloader-subtitle');
        if (subEl && typeof window.__getBujoPhrase === 'function') {
          subEl.innerText = window.__getBujoPhrase();
        }
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
