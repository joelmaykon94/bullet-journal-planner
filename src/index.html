<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BuJo Focus</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23292524' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/><path d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2a2724">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('bujo_theme');
        if (theme === 'dark' || (!theme)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* Prevent Flash of Unstyled Content (FOUC) */
    html {
      background-color: #f4ede3;
      color: #4a3b32;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html.dark {
      background-color: #2a2724;
      color: #e3dac9;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: inherit;
      color: inherit;
    }
    app-root {
      display: block;
      height: 100%;
      width: 100%;
    }
    .app-initializer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      gap: 16px;
      background-color: inherit;
      color: inherit;
    }
    .app-initializer-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(139, 115, 85, 0.25);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: bujo-spin 0.75s linear infinite;
    }
    .app-initializer-title {
      font-family: serif, "Playfair Display", Georgia;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.06em;
      opacity: 0.85;
    }
    @keyframes bujo-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="env.js?v=2"></script>
</head>
<body>
  <app-root>
    <div class="app-initializer">
      <div class="app-initializer-spinner"></div>
      <div class="app-initializer-title">BuJo Focus</div>
    </div>
  </app-root>
</body>
</html>
