[build]
  publish = "dist/frontend/browser"
  command = "pnpm build"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# Never cache index.html or sw.js so new deployments load latest CSS/JS hashes
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Cache immutable hashed assets
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA Fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
